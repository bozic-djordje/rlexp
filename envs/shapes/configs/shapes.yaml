# 'W' - Wall
# ' ' - Empty
# 'A' - Agent
# 'D' - Door
# 'O' - Object spawn location
# Grid has (x=0,y=0) in the top left corner
# (x=max,y=0) in the bottom left corner, 
# and (x=max, y=max) in the bottom right corner
grid:
  - ['W', 'W', 'W', 'W', 'W', 'W', 'W']
  - ['W', 'W', 'W', 'O', 'W', 'W', 'W']
  - ['W', 'O', 'W', 'D', 'W', 'O', 'W']
  - ['W', ' ', ' ', ' ', ' ', ' ', 'W']
  - ['W', ' ', ' ', 'W', 'W', 'D', 'W']
  - ['W', 'A', ' ', 'W', 'W', 'O', 'W']
  - ['W', 'W', 'W', 'W', 'W', 'W', 'W']
  
# If true, origin and destination locations will be masked and the agent will have to rely on text to extact them
goal_channel: true
obs_type: vec
num_objects: 2
resample_episodes: 1
max_steps: 200
slip_chance: 0
seed: 1

# use_fetures must reflect order of keys in features. It can be a subset, but order must be followed!
use_features: [shape, colour]
features:
  # ball, triangle, square, diamond, star, key, door
  shape: [ball, key, door]
  # red, blue, green, yellow
  colour: [red, blue, green, yellow]

task_names: [go_to, go_to_easy, pick_up, retrieve]
task_id: go_to 

go_to:
  - Go to colour shape.

go_to_easy:
  - Go to colour shape.

pick_up:
  - Pick up goal_formulation.

retrieve:
  - Retrieve goal_formulation.

default_feature: "0" 
reserved_combinations:
  - shape: diamond
    colour: red
  - shape: star
    colour: blue
  - shape: square
    colour: green
  - shape: ball
    colour: yellow