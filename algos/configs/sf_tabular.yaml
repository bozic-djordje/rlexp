general:
  seed: 1

# Experiment hyper-parameters may take a range of values in which case they will be
# optimised with Optuna
experiment: 
  w_lr: 1e-3
  psi_lr: 1e-2
  lambda: 1e-5

  warmup_steps: 100
  # This is too large, should be like 10x smaller
  buffer_size: 10000
  batch_size: 64

  # Exploration rate parameters
  epsilon_start: 0.8
  epsilon_end: 0.05
  epsilon_fraction: 0.7
  test_epsilon: 0.05
  linear_schedule: false

  action_mask: 3

# Environment hyper-parameters are fixed
environment:
  grid:
  - ['W', 'W', 'W', 'W', 'W']
  - ['W', ' ', ' ', 'G', 'W']
  - ['W', ' ', 'A', ' ', 'W']
  - ['W', 'O', ' ', ' ', 'W']
  - ['W', 'W', 'W', 'W', 'W']


  max_steps: 20
  disc_fact: 0.99
  slip_chance: 0
  goal_resample_t: 10000
  task_resample_t: null
  seed: 1

  features:
    # ball, triangle, square, diamond, star, key
    shape: [ball, triangle, square, diamond, star, key]
    # red, blue, green, yellow
    colour: [red, blue, green, yellow]

  num_confounding_features: 1
  one_hot: True

  target_obj_spawn_likelihood: 0.5

  # can contain keys and doors
  reserved_combinations:
    # - shape: key
    #   colour: red
    # - shape: ball
    #   colour: green

  task_progression: [linear]
  tasks:
    go_to: [Go to colour shape]
    pick_up: [Pick up colour shape]
    unlock: [Unlock colour door]
    retrieve: [Retrieve colour shape]
    linear: [Pick up colour shape]